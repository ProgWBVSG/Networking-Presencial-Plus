# Sube la web al hosting por FTP cada vez que cambia la rama main.
# Los datos de acceso viven en GitHub: Settings > Secrets and variables > Actions.
name: Publicar en gruponp.com.ar

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Subir por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
